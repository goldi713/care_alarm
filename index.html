<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareAlarm - Smart Care & Reminder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-header">

    <div class="brand">

        <div class="brand-icon">❤️</div>

        <div>
            <h1>CareAlarm</h1>
            <p>Smart Care & Reminder</p>
        </div>

    </div>

</header>


<main class="container">

    <!-- CLOCK -->

    <section class="clock-card">

        <div id="currentDay">
            Loading...
        </div>

        <div id="currentTime">
            00:00:00
        </div>

        <div id="currentDate">
            Loading...
        </div>

    </section>


    <!-- EMERGENCY -->

    <section class="card emergency-card">

        <h2>🆘 Emergency Alert</h2>

        <label for="emergencyContact">
            Select Emergency Contact
        </label>

        <select id="emergencyContact">

            <option value="">
                -- Select Contact --
            </option>

        </select>


        <div class="emergency-buttons">

            <button
                id="callEmergencyBtn"
                class="danger-btn">

                📞 Call Emergency Contact

            </button>


            <button
                id="whatsappEmergencyBtn"
                class="whatsapp-btn">

                💬 Send WhatsApp Alert

            </button>

        </div>


        <p
            id="emergencyStatus"
            class="status">
        </p>

    </section>


    <!-- CONTACTS -->

    <section class="card">

        <h2>👨‍👩‍👧 Family Contacts</h2>


        <div class="form-grid">

            <div>

                <label for="contactName">
                    Contact Name
                </label>

                <input
                    type="text"
                    id="contactName"
                    placeholder="e.g. Mother">

            </div>


            <div>

                <label for="contactPhone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="contactPhone"
                    placeholder="e.g. 9876543210">

            </div>

        </div>


        <button
            id="saveContactBtn"
            class="primary-btn">

            💾 Save Contact

        </button>


        <p
            id="contactStatus"
            class="status">
        </p>


        <div
            id="contactsList"
            class="contacts-list">
        </div>

    </section>


    <!-- ADD REMINDER -->

    <section class="card">

        <h2>⏰ Add Reminder</h2>


        <div class="form-grid">

            <div>

                <label for="reminderType">
                    Reminder Type
                </label>

                <select id="reminderType">

                    <option value="water">
                        💧 Water
                    </option>

                    <option value="walk">
                        🚶 Walk
                    </option>

                    <option value="sleep">
                        🌙 Sleep
                    </option>

                    <option value="medicine">
                        💊 Medicine
                    </option>

                </select>

            </div>


            <div>

                <label for="reminderTitle">
                    Reminder Name
                </label>

                <input
                    type="text"
                    id="reminderTitle"
                    placeholder="e.g. Drink Water">

            </div>


            <div
                id="medicineNameBox"
                class="hidden">

                <label for="medicineName">
                    Medicine Name
                </label>

                <input
                    type="text"
                    id="medicineName"
                    placeholder="e.g. Vitamin Tablet">

            </div>


            <div>

                <label for="reminderTime">
                    Time
                </label>

                <input
                    type="time"
                    id="reminderTime">

            </div>

        </div>


        <!-- DAYS -->

        <div class="days-section">

            <label>
                Select Days
            </label>


            <div class="day-options">

                <label class="day-option">

                    <input
                        type="checkbox"
                        value="0"
                        class="day-checkbox">

                    <span>
                        Sunday
                    </span>

                </label>


                <label class="day-option">

                    <input
                        type="checkbox"
                        value="1"
                        class="day-checkbox">

                    <span>
                        Monday
                    </span>

                </label>


                <label class="day-option">

                    <input
                        type="checkbox"
                        value="2"
                        class="day-checkbox">

                    <span>
                        Tuesday
                    </span>

                </label>


                <label class="day-option">

                    <input
                        type="checkbox"
                        value="3"
                        class="day-checkbox">

                    <span>
                        Wednesday
                    </span>

                </label>


                <label class="day-option">

                    <input
                        type="checkbox"
                        value="4"
                        class="day-checkbox">

                    <span>
                        Thursday
                    </span>

                </label>


                <label class="day-option">

                    <input
                        type="checkbox"
                        value="5"
                        class="day-checkbox">

                    <span>
                        Friday
                    </span>

                </label>


                <label class="day-option">

                    <input
                        type="checkbox"
                        value="6"
                        class="day-checkbox">

                    <span>
                        Saturday
                    </span>

                </label>

            </div>


            <button
                type="button"
                id="dailyBtn"
                class="secondary-btn">

                📅 Select Daily

            </button>


            <button
                type="button"
                id="clearDaysBtn"
                class="small-btn">

                Clear Days

            </button>


            <p
                id="daysStatus"
                class="status">
            </p>

        </div>


        <button
            id="saveReminderBtn"
            class="primary-btn">

            ➕ Save Reminder

        </button>


        <button
            id="cancelEditBtn"
            class="secondary-btn hidden">

            Cancel Edit

        </button>


        <p
            id="reminderStatus"
            class="status">
        </p>

    </section>


    <!-- TODAY'S REMINDERS -->

    <section class="card">

        <div class="section-title-row">

            <h2>
                📋 Today's Reminders
            </h2>


            <button
                id="testNotificationBtn"
                class="small-btn">

                🔔 Test Alert

            </button>

        </div>


        <div
            id="todayReminders"
            class="reminders-list">
        </div>

    </section>


    <!-- ALL REMINDERS -->

    <section class="card">

        <h2>
            🗓️ All Saved Reminders
        </h2>


        <div
            id="allReminders"
            class="reminders-list">
        </div>

    </section>

</main>


<!-- ALARM POPUP -->

<div
    id="alarmOverlay"
    class="alarm-overlay hidden">

    <div class="alarm-box">

        <div class="alarm-icon">
            🔔
        </div>


        <h2 id="alarmTitle">
            Reminder
        </h2>


        <p id="alarmMessage">
            It is time for your reminder.
        </p>


        <div class="alarm-buttons">


            <button
                id="alarmEditBtn"
                class="primary-btn">

                ✏️ Edit

            </button>


            <button
                id="alarmCallBtn"
                class="danger-btn">

                📞 Call

            </button>


            <button
                id="alarmWhatsappBtn"
                class="whatsapp-btn">

                💬 WhatsApp

            </button>


            <button
                id="alarmStopBtn"
                class="danger-btn">

                ⛔ Stop

            </button>


            <button
                id="alarmSnoozeBtn"
                class="secondary-btn">

                😴 Snooze 5 Minutes

            </button>


        </div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
