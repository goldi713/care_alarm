<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareAlarm</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>❤️ CareAlarm</h1>
        <p>Smart Care & Reminder</p>
    </header>


    <!-- MAIN -->
    <main>

        <!-- WELCOME -->
        <section class="welcome">
            <h2>Hello! 👋</h2>
            <p>How can we help you today?</p>
        </section>


        <!-- CARDS -->
        <section class="cards">


            <!-- ================= ALARM ================= -->

            <div class="card">

                <span class="icon">⏰</span>

                <h3>Alarm</h3>

                <p>Set your daily alarms</p>

                <button onclick="showAlarmBox()">
                    + Add Alarm
                </button>


                <!-- ADD ALARM BOX -->

                <div id="alarmBox" class="popup-box">

                    <h3>⏰ Add Alarm</h3>

                    <label for="alarmTime">
                        Select Time:
                    </label>

                    <input type="time" id="alarmTime">


                    <label for="alarmName">
                        Alarm Name:
                    </label>

                    <input
                        type="text"
                        id="alarmName"
                        placeholder="e.g. Morning"
                    >


                    <button onclick="saveAlarm()">
                        Save Alarm
                    </button>

                </div>


                <!-- ALARM LIST -->

                <div id="alarmList"></div>

            </div>


            <!-- ================= MEDICINE ================= -->

            <div class="card">

                <span class="icon">💊</span>

                <h3>Medicine</h3>

                <p>Never miss your medicine</p>

                <button onclick="setMedicineReminder()">
                    Set Reminder
                </button>

            </div>


            <!-- ================= EMERGENCY ================= -->

            <div class="card emergency">

                <span class="icon">🚨</span>

                <h3>Emergency</h3>

                <p>Get help quickly</p>

                <button onclick="emergencyAlert()">
                    Emergency Alert
                </button>

            </div>


        </section>

    </main>


    <!-- FOOTER -->

    <footer>
        <p>© 2026 CareAlarm</p>
    </footer>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
